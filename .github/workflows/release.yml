name: Release

# Builds the installers for a version tag (v1.2.3) and attaches them to a
# draft GitHub Release, which is published by hand after a check (PLAN.md §14.3).
# Signing follows decision D10: see apps/desktop/electron-builder.yml.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the app's version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version ${version} (apps/desktop/package.json)."
            exit 1
          fi
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --draft
          --title "Postloom ${GITHUB_REF_NAME#v}"
          --notes-file docs/release-notes-template.md
          --prerelease=${{ contains(github.ref_name, '-') }}
      # What went into this version: every package and its licence (SPDX), from
      # GitHub's dependency graph of the tagged commit's lockfile.
      - name: Attach the software bill of materials (SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' \
            > "postloom-${GITHUB_REF_NAME}.spdx.json"
          gh release upload "${GITHUB_REF_NAME}" "postloom-${GITHUB_REF_NAME}.spdx.json"

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # No Developer ID: macOS builds are signed ad-hoc only (D10).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm package
      - name: Installer size budget
        run: node scripts/check-installer-size.mjs apps/desktop/release
      - name: The macOS app is signed (ad-hoc) and intact
        if: runner.os == 'macOS'
        run: |
          for app in apps/desktop/release/mac*/Postloom.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - name: Checksums
        working-directory: apps/desktop/release
        run: |
          for file in *.exe *.dmg *.zip *.AppImage *.deb; do
            [ -f "$file" ] || continue
            node -e "const c=require('node:crypto'),f=require('node:fs');const n=process.argv[1];console.log(c.createHash('sha256').update(f.readFileSync(n)).digest('hex')+'  '+n)" "$file" > "$file.sha256"
          done
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/release
        run: |
          shopt -s nullglob
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            *.exe *.dmg *.zip *.AppImage *.deb *.sha256
