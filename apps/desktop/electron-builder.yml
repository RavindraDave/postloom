# Packaging for Windows, macOS and Linux (PLAN.md §14.2).
# Signing follows decision D10: Windows is signed by the Microsoft Store; the
# GitHub builds are unsigned. macOS gets only a basic built-in ("ad-hoc")
# signature, which Apple Silicon Macs need to open an app at all.
appId: com.ravindradave.postloom
productName: Postloom
executableName: postloom
copyright: Copyright © 2026 Ravindra Dave

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

asar: true

# Electron fuses (PLAN.md §10.2): lock down how the packaged app can be started.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  # One click, per-user install: no admin rights, no confusing options.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # "-" signs ad-hoc: no Apple Developer ID (D10). The hardened runtime only
  # matters for notarization, which needs a Developer ID, so it stays off.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Ravindra Dave <ravindra.dave86@gmail.com>
  synopsis: Personal emails, from your spreadsheet
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish: null
